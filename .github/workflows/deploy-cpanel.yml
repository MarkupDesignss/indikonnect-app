name: Indiekonnect cPanel Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git commit SHA or release tag to deploy (blank = current main)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: indiekonnect-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Both Panels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_ref || github.sha }}
          persist-credentials: false

      - name: Set release metadata
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          RELEASE="v1.0.${RUN_NUMBER}"
          DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "DEPLOYED_AT=$DEPLOYED_AT" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_RELEASE_VERSION=$RELEASE" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_RELEASE_COMMIT=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_RELEASE_DATE=$DEPLOYED_AT" >> "$GITHUB_ENV"
          echo "Release: $RELEASE ($SHA)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check environment variables
        shell: bash
        env:
          API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          CUSTOMER_URL: ${{ secrets.CUSTOMER_APP_URL }}
          DISTRIBUTOR_URL: ${{ secrets.DISTRIBUTOR_APP_URL }}
        run: |
          for key in API_URL CUSTOMER_URL DISTRIBUTOR_URL; do
            if [ -z "${!key}" ]; then
              echo "::error::$key missing"
              exit 1
            fi
          done

      - name: Build Customer Panel
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.CUSTOMER_APP_URL }}
          NEXT_PUBLIC_APP_BASE_PATH: /indiekonnect-web
          CI: "true"
        run: npm run build:customer

      - name: Build Distributor Panel
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.DISTRIBUTOR_APP_URL }}
          NEXT_PUBLIC_APP_BASE_PATH: /indiekonnect-distributor
          CI: "true"
        run: npm run build:distributor

      - name: Verify outputs and write release manifests
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f out-customer/index.html
          test -f out-distributor/index.html
          for panel in customer distributor; do
            PANEL="$panel" node - <<'NODE'
          const fs = require('node:fs');
          const panel = process.env.PANEL;
          const data = {
            version: process.env.RELEASE,
            commit: process.env.SOURCE_SHA,
            deployedAt: process.env.DEPLOYED_AT,
            runId: process.env.RUN_ID,
            repository: process.env.REPOSITORY,
            panel
          };
          fs.writeFileSync(`out-${panel}/release.json`, JSON.stringify(data, null, 2) + '\n');
          NODE
          done
          du -sh out-customer out-distributor

      - name: Archive built panels for rollback
        uses: actions/upload-artifact@v4
        with:
          name: indiekonnect-${{ env.RELEASE }}-${{ env.SHORT_SHA }}
          path: |
            out-customer/
            out-distributor/
          retention-days: 90
          if-no-files-found: error

      - name: Validate FTP credentials
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_CUSTOMER_USERNAME: ${{ secrets.FTP_CUSTOMER_USERNAME }}
          FTP_CUSTOMER_PASSWORD: ${{ secrets.FTP_CUSTOMER_PASSWORD }}
          FTP_DISTRIBUTOR_USERNAME: ${{ secrets.FTP_DISTRIBUTOR_USERNAME }}
          FTP_DISTRIBUTOR_PASSWORD: ${{ secrets.FTP_DISTRIBUTOR_PASSWORD }}
        run: |
          for key in FTP_HOST FTP_CUSTOMER_USERNAME FTP_CUSTOMER_PASSWORD FTP_DISTRIBUTOR_USERNAME FTP_DISTRIBUTOR_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::$key missing"
              exit 1
            fi
          done

      - name: Deploy Customer to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_CUSTOMER_USERNAME }}
          password: ${{ secrets.FTP_CUSTOMER_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./out-customer/
          server-dir: ./
          state-name: .ftp-deploy-customer.json
          timeout: 60000
          log-level: standard
          dangerous-clean-slate: false
          dry-run: false

      - name: Deploy Distributor to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_DISTRIBUTOR_USERNAME }}
          password: ${{ secrets.FTP_DISTRIBUTOR_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./out-distributor/
          server-dir: ./
          state-name: .ftp-deploy-distributor.json
          timeout: 60000
          log-level: standard
          dangerous-clean-slate: false
          dry-run: false

      - name: Deployment checks completed
        env:
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "## Deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: **$RELEASE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$SOURCE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- UTC build time: $DEPLOYED_AT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Customer: FTPS upload completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Distributor: FTPS upload completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: https://github.com/$REPOSITORY/actions/runs/$RUN_ID" >> "$GITHUB_STEP_SUMMARY"
