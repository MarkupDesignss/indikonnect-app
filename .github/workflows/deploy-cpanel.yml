name: Indiekonnect cPanel Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indiekonnect-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Validate GitHub Variables
      - name: Check environment variables
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          CUSTOMER_URL: ${{ vars.CUSTOMER_APP_URL }}
          DISTRIBUTOR_URL: ${{ vars.DISTRIBUTOR_APP_URL }}
        run: |
          test -n "$API_URL" || {
            echo "NEXT_PUBLIC_API_URL missing"
            exit 1
          }

          test -n "$CUSTOMER_URL" || {
            echo "CUSTOMER_APP_URL missing"
            exit 1
          }

          test -n "$DISTRIBUTOR_URL" || {
            echo "DISTRIBUTOR_APP_URL missing"
            exit 1
          }

          echo "All environment variables available"

      # Customer production build
      - name: Build Customer Panel
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.CUSTOMER_APP_URL }}
          NEXT_PUBLIC_APP_BASE_PATH: /indiekonnect-web
          CI: "true"
        run: npm run build:customer

      # Distributor production build
      - name: Build Distributor Panel
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.DISTRIBUTOR_APP_URL }}
          NEXT_PUBLIC_APP_BASE_PATH: /indiekonnect-distributor
          CI: "true"
        run: npm run build:distributor

      - name: Verify build outputs
        run: |
          test -f out-customer/index.html || exit 1
          test -f out-distributor/index.html || exit 1
          echo "Both builds successful"

      # Customer FTP
      - name: Deploy Customer to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_CUSTOMER_USERNAME }}
          password: ${{ secrets.FTP_CUSTOMER_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./out-customer/
          server-dir: ./
          state-name: .ftp-deploy-customer.json
          timeout: 60000
          log-level: standard
          dangerous-clean-slate: false
          dry-run: true

      # Distributor FTP
      - name: Deploy Distributor to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_DISTRIBUTOR_USERNAME }}
          password: ${{ secrets.FTP_DISTRIBUTOR_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./out-distributor/
          server-dir: ./
          state-name: .ftp-deploy-distributor.json
          timeout: 60000
          log-level: standard
          dangerous-clean-slate: false
          dry-run: true
