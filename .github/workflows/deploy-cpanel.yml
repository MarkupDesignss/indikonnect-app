name: Indiekonnect cPanel Deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git commit SHA or release tag to deploy (blank = current main)"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: indiekonnect-deployment
  cancel-in-progress: false
jobs:
  deploy:
    name: Build and Deploy Both Panels (Temporary Quality Bypass)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_ref || 'refs/heads/main') || github.sha }}
          persist-credentials: false
      # ==========================================
      # RELEASE METADATA
      # ==========================================
      - name: Set release metadata
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          RELEASE="v1.0.${GITHUB_RUN_NUMBER}"
          DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "DEPLOYED_AT=$DEPLOYED_AT" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_RELEASE_VERSION=$RELEASE" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_RELEASE_COMMIT=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_RELEASE_DATE=$DEPLOYED_AT" >> "$GITHUB_ENV"
          echo "Release: $RELEASE ($SHA)"
      # ==========================================
      # NODE AND DEPENDENCIES
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # ==========================================
      # ENVIRONMENT VALIDATION
      # ==========================================
      - name: Check environment variables
        shell: bash
        env:
          API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          CUSTOMER_URL: ${{ secrets.CUSTOMER_APP_URL }}
          DISTRIBUTOR_URL: ${{ secrets.DISTRIBUTOR_APP_URL }}
        run: |
          set -euo pipefail
          for key in API_URL CUSTOMER_URL DISTRIBUTOR_URL; do
            if [ -z "${!key}" ]; then
              echo "::error::$key missing"
              exit 1
            fi
          done
      # ==========================================
      # TEMPORARY NON-BLOCKING QUALITY CHECKS
      # ==========================================
      - name: Architecture and Import Verification (non-blocking)
        id: architecture
        continue-on-error: true
        run: npm run verify
      - name: ESLint Validation (non-blocking)
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: TypeScript Validation (non-blocking)
        id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Temporary Quality Bypass Notice
        run: |
          echo "::warning::Quality checks are temporarily non-blocking. Deployment can proceed despite lint or type errors."
      # ==========================================
      # CUSTOMER BUILD
      # ==========================================
      - name: Build Customer Panel
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.CUSTOMER_APP_URL }}
          NEXT_PUBLIC_APP_BASE_PATH: /indiekonnect-web
        run: npm run build:customer
      # ==========================================
      # DISTRIBUTOR BUILD
      # ==========================================
      - name: Build Distributor Panel
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.DISTRIBUTOR_APP_URL }}
          NEXT_PUBLIC_APP_BASE_PATH: /indiekonnect-distributor
        run: npm run build:distributor
      # ==========================================
      # VERIFY BUILD OUTPUTS
      # ==========================================
      - name: Verify outputs and write release manifests
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f out-customer/index.html
          test -f out-distributor/index.html
          for panel in customer distributor; do
            PANEL="$panel" node - <<'NODE'
          const fs = require('node:fs');
          const panel = process.env.PANEL;
          const data = {
            version: process.env.RELEASE,
            commit: process.env.SOURCE_SHA,
            deployedAt: process.env.DEPLOYED_AT,
            runId: process.env.RUN_ID,
            repository: process.env.REPOSITORY,
            panel
          };
          fs.writeFileSync(
            `out-${panel}/release.json`,
            JSON.stringify(data, null, 2) + '\n'
          );
          NODE
          done
          du -sh out-customer out-distributor
      # ==========================================
      # BACKUP BUILD ARTIFACTS
      # ==========================================
      - name: Archive built panels for rollback
        uses: actions/upload-artifact@v4
        with:
          name: indiekonnect-${{ env.RELEASE }}-${{ env.SHORT_SHA }}
          path: |
            out-customer/
            out-distributor/
          retention-days: 90
          if-no-files-found: error
      # ==========================================
      # FTP CREDENTIAL VALIDATION
      # ==========================================
      - name: Validate FTP credentials
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_CUSTOMER_USERNAME: ${{ secrets.FTP_CUSTOMER_USERNAME }}
          FTP_CUSTOMER_PASSWORD: ${{ secrets.FTP_CUSTOMER_PASSWORD }}
          FTP_DISTRIBUTOR_USERNAME: ${{ secrets.FTP_DISTRIBUTOR_USERNAME }}
          FTP_DISTRIBUTOR_PASSWORD: ${{ secrets.FTP_DISTRIBUTOR_PASSWORD }}
        run: |
          set -euo pipefail
          for key in FTP_HOST FTP_CUSTOMER_USERNAME FTP_CUSTOMER_PASSWORD FTP_DISTRIBUTOR_USERNAME FTP_DISTRIBUTOR_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::$key missing"
              exit 1
            fi
          done
      # ==========================================
      # DEPLOY CUSTOMER
      # ==========================================
      - name: Deploy Customer to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_CUSTOMER_USERNAME }}
          password: ${{ secrets.FTP_CUSTOMER_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./out-customer/
          server-dir: ./
          state-name: .ftp-deploy-customer.json
          timeout: 60000
          log-level: standard
          dangerous-clean-slate: false
          dry-run: false
      # ==========================================
      # DEPLOY DISTRIBUTOR
      # ==========================================
      - name: Deploy Distributor to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_DISTRIBUTOR_USERNAME }}
          password: ${{ secrets.FTP_DISTRIBUTOR_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./out-distributor/
          server-dir: ./
          state-name: .ftp-deploy-distributor.json
          timeout: 60000
          log-level: standard
          dangerous-clean-slate: false
          dry-run: false
      # ==========================================
      # SUCCESS SUMMARY
      # ==========================================
      - name: Deployment Success Summary
        if: ${{ success() }}
        env:
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "## Deployment completed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: **$RELEASE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$SOURCE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- UTC build time: $DEPLOYED_AT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Architecture: ${{ steps.architecture.outcome }} (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ESLint: ${{ steps.lint.outcome }} (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "- TypeScript: ${{ steps.typecheck.outcome }} (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Temporary quality bypass: Enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Customer build: Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Distributor build: Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Customer FTPS deployment: Completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Distributor FTPS deployment: Completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: https://github.com/$REPOSITORY/actions/runs/$RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      # ==========================================
      # FAILURE SUMMARY
      # ==========================================
      - name: Workflow Failure Summary
        if: ${{ failure() }}
        env:
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "## Workflow failed" >> "$GITHUB_STEP_SUMMARY"
          echo "- One or more mandatory steps failed." >> "$GITHUB_STEP_SUMMARY"
          echo "- Remaining build or deployment steps were blocked." >> "$GITHUB_STEP_SUMMARY"
          echo "- Check the failed step in GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: https://github.com/$REPOSITORY/actions/runs/$RUN_ID" >> "$GITHUB_STEP_SUMMARY"
